<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Had Seddiqi</title>
<!--
  Staging home: the website over a live 3D sky, with Fly pinned at the foot of the sidebar.
  One renderer for everything: #sky is the flight lab in ?attract mode, which draws the backdrop
  (your jet held still in the backdrop's framing, the live MMO jets flying around it) and is also
  the game. Clicking Fly fades the site out and glides that same camera into the chase cam behind
  your jet, as one shot; the HUD fades in and the watch-only socket becomes a seat. Esc/Back glides
  back out and the site fades in. Nobody takes a seat (or counts as aloft) until they press Fly.
  Fly item picks: menu concept, pinned sidebar, blink every 5s for 2s (sine swell, strength 0.95, 2px halo).
-->
<style>
  :root { --bg: #1c2433; --muted: #8a919c; --glow: #e4c56f; --sky: #0f1520;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); }
  /* 100% rather than 100vh: on iPad Safari 100vh is the height with the toolbars hidden, which
     pushes the pinned Fly under the visible edge. */
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
  /* The sky fades in once it has drawn the ground; the site is readable on navy before that. */
  #sky { opacity: 0; transition: opacity 1.2s ease; z-index: 1; }
  #sky.on { opacity: 1; }
  #site { z-index: 2; background: transparent; color-scheme: normal; transition: opacity .9s ease; }
  body.flying #site { opacity: 0; pointer-events: none; }
  #exit { position: fixed; z-index: 3; right: calc(14px + env(safe-area-inset-right)); top: calc(36px + env(safe-area-inset-top));
    font: 10px/1 var(--mono); letter-spacing: .16em; color: var(--glow); background: none; border: 0; padding: 10px 2px; cursor: pointer;
    opacity: 0; pointer-events: none; transition: opacity .6s .6s, color .2s; -webkit-tap-highlight-color: transparent; }
  /* gold like the flight HUD, which has no gray text */
  /* only while flying: a tapped button keeps :hover on touch screens, which kept it on over the site */
  body.flying #exit:hover, body.flying #exit:focus-visible { opacity: 1; }
  body.flying #exit { opacity: .7; pointer-events: auto; }
</style>
</head>
<body>
<!-- tilt steering needs the motion sensors; the frame is created by script so its src waits for the site -->
<iframe id="sky" title="Fly" tabindex="-1" allow="gamepad; fullscreen; accelerometer; gyroscope"></iframe>
<iframe id="site" title="Had Seddiqi"></iframe>
<button id="exit" >Back to site</button>
<script>
const $ = (s) => document.querySelector(s);
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const skyFrame = $('#sky'), site = $('#site');
const F = () => { try { return skyFrame.contentWindow.__flight; } catch { return null; } };
const siteDoc = () => { try { return site.contentDocument; } catch { return null; } };
let state = 'site';   // site | flying

// SR-71 climbing away, three-quarter view from above. Silhouette rendered from the
// flight lab's jet (scripts/pack-jet.mjs output) and traced; nose up and to the right.
// Jet icon: "Jet fighter" by Delapouite, game-icons.net, CC BY 3.0 (https://creativecommons.org/licenses/by/3.0/).
const JET_SVG = '<svg class="fly-jet" viewBox="24 24 464 464" aria-hidden="true"><path fill="currentColor" d="M461.5 31.85c-5 1.2-10.4 3.4-16.4 6.4c-12 6-26.7 15.3-42.1 26.1c-26.7 18.7-55.5 41.75-75 59.95l39.8 19.9l19.9 39.8c18.2-19.5 41.2-48.3 59.9-75c10.8-15.35 20.1-30.05 26.2-42.15c3-6 5.2-11.3 6.3-16.3c1.2-5 1.9-10.9-2.9-15.7c-4.8-4.56-10-4.25-15.7-3m-14.8 33.4c4.9 4.71 5.6 12.1 3.8 18.7s-6.1 13.3-12.9 20.15l-42.2 42.2l-29.6-29.7L408 74.45c6.8-6.8 13.5-11.06 20.1-12.9c6.1-1.71 14.3-.44 18.6 3.7M183.2 109.5l-21.3 21.2l45.6 5v-26.2zm129.9 25.2l-43.5 21.8l-153 200.1l13.7 13.8l97.5-97.5l11.3 11.3c-32.5 32.5-65 65.1-97.5 97.6l13.8 13.6l200.1-153l21.8-43.5l-21.4-42.8zm-256.59.4l7.4 22.2l120.99 83.5l64.5-84.3zm38.1 62.8l-13.1 13.2l24.39 24.3l17.6-17.5zm260.89 64.7l-84.3 64.5l83.5 121l22.2 7.3zm-190.9 4.8l-110.99 9.1l-22.6 22.6l82.39 35.4zm212.1 41.2l4.6 41.5l17.1-17.2v-24.3zm-132.1 38.8l-67 51.2l35.3 82.4l22.6-22.6zm-138.7 21.2l-13.09 13.1l37.49 37.4l13.1-13zm188.2 19.9l-17.5 17.6l24.3 24.3l13.2-13.1z"/></svg>';

// The Fly item lives inside the site page: pinned sidebar on wide screens, end of the menu row on phones.
const SITE_CSS = `
  .fly-jet { width: 15px; height: 15px; vertical-align: -2px; margin-right: 8px; transition: transform .35s cubic-bezier(.2,.7,.2,1); }
  .menu .fly-item { margin: 1.4rem 0 0; }
  /* Same font, size and color as the other menu items, framed so it reads as a button. */
  .fly-item a { color: var(--text); white-space: nowrap; display: inline-block; padding: .3em .75em .3em .6em;
    border: 1px solid rgba(200, 205, 213, .45); border-radius: 4px; transition: border-color .2s, color .2s; }
  .fly-item a:hover { text-decoration: none; }
  /* hover only where a pointer can hover: a tap leaves :hover stuck on phones, so Fly stayed gold after Back */
  .fly-item a:focus-visible { color: var(--glow); border-color: var(--glow); }
  .fly-item a:focus-visible .fly-jet { transform: translate(2.5px, -2.5px); }
  @media (hover: hover) {
    .fly-item a:hover { color: var(--glow); border-color: var(--glow); }
    .fly-item a:hover .fly-jet { transform: translate(2.5px, -2.5px); }
  }
  /* Fixed rather than sticky: on short pages the grid row is no taller than the menu. */
  @media (min-width: 641px) {
    .menu { position: fixed; top: 0; bottom: 0; z-index: 2; width: var(--menu-width);
      left: max(1.5rem, calc((100% - 64rem) / 2 + 1.5rem)); padding: 3rem 0 max(2rem, calc(env(safe-area-inset-bottom) + 1rem)); display: flex; flex-direction: column; }
    main { grid-column: 2; }
    .menu ul { flex: 1; display: flex; flex-direction: column; }
    .menu .fly-item { margin: auto 0 0; }
  }
  /* phones: centered on the menu row, without making the row taller */
  @media (max-width: 640px) { .menu ul { align-items: center; } .menu .fly-item { margin: -.4em 0 -.4em auto; } }
`;
function decorateSite() {
  const doc = siteDoc(); if (!doc || !doc.head) return;
  if (!doc.getElementById('fly-css')) {
    const st = doc.createElement('style'); st.id = 'fly-css'; st.textContent = SITE_CSS; doc.head.appendChild(st);
  }
  const ul = doc.querySelector('.menu ul');
  if (ul && !doc.querySelector('.fly-item')) {
    const li = doc.createElement('li'); li.className = 'fly-item';
    li.innerHTML = `<a href="#fly">${JET_SVG}Fly</a>`;
    ul.appendChild(li);
  }
  for (const a of doc.querySelectorAll('a[href="#fly"]')) a.onclick = (e) => { e.preventDefault(); enter(); };
  // Keep the address bar in step with the page shown inside, so a reload lands on the same page.
  try { const p = doc.location.pathname; if (p && !p.startsWith('/lab/')) history.replaceState(null, '', `?p=${encodeURIComponent(p)}`); } catch {}
}

// The site sits on a see-through navy wash over the sky (the backdrop lab's "site background 0.49").
const SITE_BG = 'html, body { background: rgba(28, 36, 51, 0.49) !important; }';
function styleSite() {
  const doc = siteDoc(); if (!doc || !doc.head) return;
  let tag = doc.getElementById('backdrop-wash');
  if (!tag) { tag = doc.createElement('style'); tag.id = 'backdrop-wash'; doc.head.appendChild(tag); }
  tag.textContent = SITE_BG;
}
site.addEventListener('load', () => {
  styleSite(); decorateSite();
  try { wireGestures(site.contentWindow); } catch (err) { console.warn('gestures', err); }
  try { site.contentWindow.addEventListener('keydown', onKey); } catch {}
});
{
  const p = new URLSearchParams(location.search).get('p');
  site.src = p && p.startsWith('/') && !p.startsWith('//') ? p : '/';
}
// The sky loads behind the site and fades up when it has settled next to a live jet (or found none).
skyFrame.src = '../flight/?attract';
const waitSky = setInterval(() => {
  const f = F(); if (!f || !f.ready) return;
  clearInterval(waitSky);
  skyFrame.classList.add('on');
  try { skyFrame.contentWindow.addEventListener('keydown', onKey); } catch {}
}, 100);

// ---------- gestures on the site pan the backdrop camera ----------
// Page position pans (a pure function of scroll, so it always reverses); sideways swipes and
// wheel turn it. Same feel as the backdrop lab; offsets go to the flight lab's camera rig.
const DEG = Math.PI / 180;
const G = { scrollYaw: 0, scrollPitch: 0, sideYaw: 0, yaw: 0, pitch: 0 };
function readScroll(w) {
  const screens = w.scrollY / Math.max(w.innerHeight, 1);
  G.scrollYaw = Math.min(screens * 10, 90) * DEG;
  G.scrollPitch = Math.min(screens * 1.5, 8) * DEG;
}
function wireGestures(w) {
  const doc = w.document;
  if (doc.__sky) return;
  doc.__sky = true;
  doc.documentElement.style.overscrollBehaviorX = 'none';   // stop sideways swipes from navigating back
  w.addEventListener('scroll', () => readScroll(w), { passive: true });
  w.addEventListener('wheel', (e) => {
    const dx = e.deltaX || (e.shiftKey ? e.deltaY : 0);
    if (dx && Math.abs(dx) > Math.abs(e.deltaY) * 0.5) { G.sideYaw += dx * 0.001; e.preventDefault(); }
  }, { passive: false });
  let t0 = null, axis = null;
  w.addEventListener('touchstart', (e) => { if (e.touches.length === 1) { t0 = { x: e.touches[0].clientX, y: e.touches[0].clientY }; axis = null; } }, { passive: true });
  w.addEventListener('touchmove', (e) => {
    if (!t0 || e.touches.length !== 1) return;
    const x = e.touches[0].clientX, y = e.touches[0].clientY, dx = x - t0.x, dy = y - t0.y;
    if (!axis && Math.hypot(dx, dy) > 8) axis = Math.abs(dx) > Math.abs(dy) * 1.3 ? 'x' : 'y';
    if (axis === 'x') { G.sideYaw -= dx * 0.003; t0 = { x, y }; e.preventDefault(); }
  }, { passive: false });
  w.addEventListener('touchend', () => { t0 = null; }, { passive: true });
  readScroll(w);
}
let lastG = performance.now();
(function stepGestures(now) {
  requestAnimationFrame(stepGestures);
  const dt = Math.min((now - lastG) / 1000, 0.1); lastG = now;
  const k = 1 - Math.exp(-dt / 0.18);
  G.yaw += (G.scrollYaw + G.sideYaw - G.yaw) * k;
  G.pitch += (G.scrollPitch - G.pitch) * k;
  const rig = F()?.renderer?.rig;
  if (rig) { rig.orbit.yaw = G.yaw; rig.orbit.pitch = G.pitch; }
})(performance.now());

// ---------- Fly blink: a slow swell to the gold of the "next role" orb and back ----------
const MUTED = [200, 205, 213], GOLD = [228, 197, 111];   // --text, --glow
const EVERY = 5, LEN = 2, STR = 0.95, HALO = 2;
const mix = (k) => `rgb(${MUTED.map((m, i) => Math.round(m + (GOLD[i] - m) * k)).join(',')})`;
const FRAMES = [[0, 0], [0.5, 1], [1, 0]].map(([offset, v]) => ({ offset, easing: 'cubic-bezier(.37,0,.63,1)', color: mix(v * STR),
  borderColor: v ? mix(v * STR) : 'rgba(200, 205, 213, .45)',
  filter: `drop-shadow(0 0 ${(v * HALO).toFixed(2)}px rgba(228,197,111,${(v * STR * 0.55).toFixed(3)}))` }));
if (!reduceMotion) setTimeout(function blink() {
  const doc = siteDoc(), a = doc && doc.querySelector('.fly-item a');
  if (a && state === 'site' && !a.matches(':hover')) a.animate(FRAMES, { duration: LEN * 1000, easing: 'linear' });
  setTimeout(blink, EVERY * 1000);
}, 3000);   // first blink ~3s after load

// ---------- enter / leave: one camera move in one scene ----------
function enter() {
  const f = F(); if (state !== 'site' || !f || !f.fly) return;
  state = 'flying';
  document.body.classList.add('flying');
  f.fly();
  skyFrame.classList.add('on');
  skyFrame.tabIndex = 0;
  skyFrame.focus();
}
function leave() {
  const f = F(); if (state !== 'flying' || !f) return;
  state = 'site';
  document.body.classList.remove('flying');
  f.land();
  $('#exit').blur();
  skyFrame.tabIndex = -1;
  site.focus();
}
function onKey(e) { if (e.key === 'Escape') leave(); }
addEventListener('keydown', onKey);
$('#exit').addEventListener('click', leave);
</script>
</body>
</html>
