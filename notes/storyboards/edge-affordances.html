<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Edge affordances</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Petrona:wght@300&display=swap">
<!--
  Mockups of small "edge" controls that take a visitor from the website into the 3D world,
  the first stop of a reels-style feed of worlds. The site and the SR-71 scene come from the
  backdrop lab (/lab/sr71/), loaded in an iframe and driven through its window.__lab handle.
  Nothing here edits the lab; it only reads the camera and flips settings at runtime.
-->
<style>
  :root {
    --bg: #1c2433; --text: #c8cdd5; --muted: #8a919c; --accent: #e6e9ed; --glow: #e4c56f;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --font: Verdana, Geneva, system-ui, -apple-system, sans-serif;
    --edge: 14px;
    --ease: cubic-bezier(.2, .7, .2, 1);
  }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font: 13px/1.4 var(--font); }
  /* 100% rather than 100vh: on iPad Safari 100vh is the height with the toolbars hidden, which
     pushes the bottom of the page (and the pinned Fly) under the visible edge. */
  #lab { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
  #veil { position: fixed; inset: 0; background: var(--bg); opacity: 0; pointer-events: none; transition: opacity .32s ease; z-index: 5; }
  #veil.on { opacity: 1; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .gold { color: var(--glow); }
  [data-concept] { display: none; }
  body[data-c="jet"] [data-concept~="jet"], body[data-c="hud"] [data-concept~="hud"], body[data-c="tape"] [data-concept~="tape"],
  body[data-c="frame"] [data-concept~="frame"], body[data-c="alt"] [data-concept~="alt"] { display: block; }
  .edge { position: fixed; z-index: 3; }

  /* 1. Jet silhouette in the corner */
  .c-jet { right: calc(var(--edge) - 6px + env(safe-area-inset-right)); bottom: calc(var(--edge) - 6px + env(safe-area-inset-bottom)); width: 48px; height: 48px; }
  .c-jet .jet { position: absolute; left: 50%; top: 50%; width: 34px; height: 18px; margin: -9px 0 0 -17px; color: var(--muted); opacity: .75;
    transform: rotate(-128deg); transition: transform .45s var(--ease), color .25s, opacity .25s; }
  .c-jet .trail { position: absolute; left: 50%; top: 50%; width: 1px; height: 0; transform-origin: 0 0; transform: rotate(142deg) translateY(12px);
    background: linear-gradient(var(--glow), transparent); opacity: 0; transition: height .45s var(--ease), opacity .3s; }
  .c-jet .tip { position: absolute; right: 44px; bottom: 17px; font: 9px/1 var(--mono); letter-spacing: .18em; color: var(--glow); opacity: 0; transform: translateX(4px); transition: opacity .25s, transform .35s var(--ease); white-space: nowrap; }
  .c-jet:hover .jet, .c-jet:focus-visible .jet { color: var(--glow); opacity: 1; transform: rotate(-128deg) translateY(-3px); }
  .c-jet:hover .trail, .c-jet:focus-visible .trail { height: 26px; opacity: .8; }
  .c-jet:hover .tip, .c-jet:focus-visible .tip { opacity: 1; transform: none; }
  body.entering[data-c="jet"] .c-jet .jet { transition: transform 1.6s cubic-bezier(.5, 0, .2, 1), opacity 1.6s ease-in, color .2s; color: var(--glow);
    transform: translate(-42vw, -38vh) rotate(-128deg) scale(.35); opacity: 0; }
  body.entering[data-c="jet"] .c-jet .trail { transition: none; opacity: 0; }

  /* 2. HUD readout, bottom left; the same readout carries on inside the world */
  .hud { left: calc(var(--edge) + env(safe-area-inset-left)); bottom: calc(var(--edge) + env(safe-area-inset-bottom)); text-align: left;
    font: 10px/1.55 var(--mono); letter-spacing: .12em; color: var(--muted); opacity: .6; padding: 6px 8px 6px 0; transition: opacity .25s, color .25s; font-variant-numeric: tabular-nums; }
  .hud .row { display: block; white-space: nowrap; }
  .hud .orb { display: inline-block; width: 5px; height: 5px; border-radius: 50%; background: var(--glow); margin: 0 7px 1px 1px; vertical-align: middle; }
  .hud .go { display: block; color: var(--glow); max-height: 0; opacity: 0; overflow: hidden; transition: max-height .3s var(--ease), opacity .25s; }
  button.hud:hover, button.hud:focus-visible { opacity: 1; color: var(--text); }
  button.hud:hover .go, button.hud:focus-visible .go { max-height: 2em; opacity: 1; }
  @media (prefers-reduced-motion: no-preference) {
    .hud .orb { animation: wink 3.2s ease-in-out infinite; }
    @keyframes wink { 0%, 100% { opacity: 1; box-shadow: 0 0 6px 1px rgba(228, 197, 111, .55); } 50% { opacity: .5; box-shadow: 0 0 1px 0 rgba(228, 197, 111, .2); } }
  }

  /* 3. Compass tape along the top edge */
  .c-tape { left: 0; right: 0; top: env(safe-area-inset-top); height: 30px; opacity: .45; transition: opacity .25s; touch-action: none; }
  .c-tape canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .c-tape .tip { position: absolute; left: 50%; top: 31px; transform: translate(-50%, -3px); font: 9px/1 var(--mono); letter-spacing: .18em; color: var(--glow); opacity: 0; transition: opacity .25s, transform .3s var(--ease); white-space: nowrap; }
  .c-tape:hover, .c-tape:focus-visible, .c-tape.pulling { opacity: 1; }
  .c-tape:hover .tip, .c-tape:focus-visible .tip, .c-tape.pulling .tip { opacity: 1; transform: translate(-50%, 0); }

  /* 4. Canopy / viewfinder corners */
  .c-frame { inset: 0; pointer-events: none; }
  .c-frame button { position: absolute; width: 44px; height: 44px; pointer-events: auto; }
  .c-frame i { position: absolute; width: 11px; height: 11px; border: 0 solid var(--text); opacity: .5; transition: all .45s var(--ease); }
  .c-frame .tl { left: env(safe-area-inset-left); top: env(safe-area-inset-top); } .c-frame .tl i { left: 12px; top: 12px; border-width: 1px 0 0 1px; }
  .c-frame .tr { right: env(safe-area-inset-right); top: env(safe-area-inset-top); } .c-frame .tr i { right: 12px; top: 12px; border-width: 1px 1px 0 0; }
  .c-frame .bl { left: env(safe-area-inset-left); bottom: env(safe-area-inset-bottom); } .c-frame .bl i { left: 12px; bottom: 12px; border-width: 0 0 1px 1px; }
  .c-frame .br { right: env(safe-area-inset-right); bottom: env(safe-area-inset-bottom); } .c-frame .br i { right: 12px; bottom: 12px; border-width: 0 1px 1px 0; }
  .c-frame.lock i { border-color: var(--glow); opacity: 1; }
  .c-frame.lock .tl i { left: 18px; top: 18px; } .c-frame.lock .tr i { right: 18px; top: 18px; }
  .c-frame.lock .bl i { left: 18px; bottom: 18px; } .c-frame.lock .br i { right: 18px; bottom: 18px; }
  .c-frame .tip { position: absolute; right: 22px; top: 36px; font: 9px/1 var(--mono); letter-spacing: .18em; color: var(--glow); opacity: 0; transition: opacity .25s; }
  .c-frame.lock .tip { opacity: 1; }
  body.entering .c-frame i, body.in-world .c-frame i { width: 22px; height: 22px; border-color: var(--glow); opacity: .8; transition-duration: 1.2s; }
  body.entering .c-frame .tl i, body.in-world .c-frame .tl i { left: 8px; top: 8px; } body.entering .c-frame .tr i, body.in-world .c-frame .tr i { right: 8px; top: 8px; }
  body.entering .c-frame .bl i, body.in-world .c-frame .bl i { left: 8px; bottom: 8px; } body.entering .c-frame .br i, body.in-world .c-frame .br i { right: 8px; bottom: 8px; }
  body.in-world .c-frame .tip { opacity: 0; }

  /* 7. Altimeter where the scrollbar would be */
  .c-alt { right: env(safe-area-inset-right); top: 18vh; bottom: 18vh; width: 34px; opacity: .45; transition: opacity .25s; }
  .c-alt canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .c-alt .tip { position: absolute; right: 34px; top: 50%; transform: translate(4px, -50%); font: 9px/1 var(--mono); letter-spacing: .18em; color: var(--glow); opacity: 0; transition: opacity .25s, transform .3s var(--ease); white-space: nowrap; }
  .c-alt:hover, .c-alt:focus-visible { opacity: 1; }
  .c-alt:hover .tip, .c-alt:focus-visible .tip { opacity: 1; transform: translate(0, -50%); }

  /* In-world chrome */
  .world { display: none; }
  body.in-world .world { display: block; }
  .w-title { left: calc(var(--edge) + 6px + env(safe-area-inset-left)); top: calc(var(--edge) + 4px + env(safe-area-inset-top)); font: 10px/1.6 var(--mono); letter-spacing: .14em; color: var(--muted); }
  .w-title b { display: block; font: 300 22px/1.2 Petrona, Georgia, serif; letter-spacing: 0; color: var(--accent); margin-top: 2px; }
  .w-exit { right: calc(var(--edge) + env(safe-area-inset-right)); top: calc(var(--edge) + env(safe-area-inset-top)); font: 10px/1 var(--mono); letter-spacing: .16em; color: var(--muted); padding: 10px 6px; }
  .w-exit:hover, .w-exit:focus-visible { color: var(--glow); }
  .w-feed { right: calc(var(--edge) + env(safe-area-inset-right)); top: 50%; transform: translateY(-50%); display: none; flex-direction: column; align-items: center; gap: 10px; }
  body.in-world .w-feed { display: flex; }
  .w-feed button { width: 36px; height: 36px; color: var(--muted); font: 15px/1 var(--mono); }
  .w-feed button:hover { color: var(--glow); }
  .w-dots { display: flex; flex-direction: column; gap: 7px; }
  .w-dots span { width: 4px; height: 4px; border-radius: 50%; background: var(--muted); opacity: .45; transition: all .3s; }
  .w-dots span.on { background: var(--glow); opacity: 1; transform: scale(1.4); }
  .w-hint { left: 50%; bottom: calc(var(--edge) + 4px + env(safe-area-inset-bottom)); transform: translateX(-50%); font: 10px/1 var(--mono); letter-spacing: .14em; color: var(--muted); white-space: nowrap; opacity: 0; transition: opacity 1s 1.2s; }
  body.in-world .w-hint { opacity: .8; }
  body.in-world .hud { opacity: .9; color: var(--text); pointer-events: none; }
  body.in-world .hud .go { display: none; }
  body.in-world .world-hud { display: block; }
  .world-hud { display: none; }
  body.in-world[data-c="hud"] .world-hud, body.in-world .c-alt, body.in-world .c-jet { display: none; }

  /* Mockup switcher (not part of any concept) */
  #switcher { position: fixed; left: 50%; bottom: calc(10px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 6;
    background: rgba(12, 16, 23, .82); border: 1px solid rgba(200, 205, 213, .16); border-radius: 12px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    width: min(420px, calc(100vw - 132px)); font-size: 12px; transition: opacity .3s; }
  body[data-c="footer"] #switcher, body[data-c="alt"] #switcher { bottom: auto; top: calc(10px + env(safe-area-inset-top)); }
  body.in-world #switcher, body.entering #switcher { opacity: 0; pointer-events: none; }
  .sw-bar { display: flex; align-items: center; gap: 4px; padding: 4px; }
  .sw-bar button { padding: 7px 10px; border-radius: 8px; color: var(--muted); }
  .sw-bar button:hover { color: var(--accent); background: rgba(200, 205, 213, .07); }
  .sw-name { flex: 1; text-align: center; color: var(--accent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sw-name small { color: var(--glow); font: 10px var(--mono); letter-spacing: .1em; margin-right: 6px; }
  .sw-notes { display: none; padding: 2px 12px 10px; color: var(--text); line-height: 1.5; border-top: 1px solid rgba(200, 205, 213, .1); }
  #switcher.open .sw-notes { display: block; }
  .sw-notes p { margin: 8px 0 0; }
  .sw-notes .k { color: var(--glow); font: 10px var(--mono); letter-spacing: .12em; text-transform: uppercase; display: block; margin-bottom: 1px; }
  .sw-notes label { display: inline-flex; align-items: center; gap: 6px; margin-top: 10px; color: var(--muted); cursor: pointer; }
  .sw-notes input { accent-color: var(--glow); }
  .sw-places { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
  .sw-places label { margin-top: 6px; color: var(--text); }
  .sw-blink { display: grid; grid-template-columns: 5.5rem 1fr 3.2rem; align-items: center; gap: 4px 8px; margin-top: 6px; }
  .sw-blink span { color: var(--muted); }
  .sw-blink output { text-align: right; font: 11px var(--mono); color: var(--text); }
  .sw-blink input[type=range] { width: 100%; accent-color: var(--glow); }
  .sw-blink select { font: inherit; color: var(--text); background: #141a25; border: 1px solid rgba(200, 205, 213, .2); border-radius: 4px; padding: 2px; grid-column: 2 / 4; }
  .sw-blink-row { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
  .sw-blink-row button { border: 1px solid rgba(200, 205, 213, .25); border-radius: 6px; padding: 4px 10px; color: var(--text); }
  .sw-blink-row button:hover { border-color: var(--glow); }
  .sw-blink-row small { color: var(--muted); font: 10px var(--mono); letter-spacing: .06em; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; font: 10px var(--mono); letter-spacing: .2em; color: var(--muted); z-index: 7; background: var(--bg); transition: opacity .6s; }
  #loading.done { opacity: 0; pointer-events: none; }
  @media (max-width: 640px) {
    #switcher { width: calc(100vw - 132px); }
    .w-hint { left: auto; right: calc(var(--edge) + env(safe-area-inset-right)); transform: none; }
    /* Phones: a fixed bottom-left readout would sit on the text, so it rides in the empty
       right end of the menu row instead and tucks away once the page scrolls. */
    button.hud { left: auto; bottom: auto; right: calc(12px + env(safe-area-inset-right)); top: calc(16px + env(safe-area-inset-top)); text-align: right; padding: 6px 4px; }
    button.hud .orb { margin: 0 6px 1px 0; }
    body.scrolled button.hud { opacity: 0; pointer-events: none; }
    .sw-bar button { padding: 7px 8px; }
  }
</style>
</head>
<body data-c="hud">
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <!-- SR-71 planform, nose to the right. Traced from the public-domain USAF 3-view
       (commons.wikimedia.org/wiki/File:Lockheed_SR-71A_3view.svg), mirrored for symmetry. -->
  <symbol id="sr71" viewBox="0 0 100 52.46">
    <path fill="currentColor" d="M0.1 26.2 L0.1 25.7 L0.9 25.7 L4.0 24.8 L5.7 18.2 L8.7 16.6 L8.9 15.8 L8.0 14.8 L7.9 14.4 L8.2 14.1 L9.1 13.8 L9.1 11.3 L10.1 10.8 L8.0 9.8 L7.7 9.4 L9.3 2.1 L10.3 0.7 L11.9 0.0 L13.6 0.3 L27.0 7.5 L31.7 7.6 L36.8 8.3 L40.3 9.2 L45.1 11.1 L45.5 11.9 L49.5 13.6 L49.7 14.2 L49.4 14.5 L45.5 15.2 L45.0 16.4 L43.7 16.6 L51.3 20.6 L74.5 20.7 L80.6 21.2 L90.0 22.7 L95.5 24.3 L98.5 25.7 L100.0 25.7 L99.8 26.1 L97.4 27.3 L93.3 28.8 L88.1 30.1 L81.8 31.1 L74.5 31.7 L51.3 31.8 L43.7 35.8 L45.0 36.0 L45.5 37.2 L49.4 37.9 L49.7 38.2 L49.5 38.7 L45.5 40.5 L45.1 41.3 L40.3 43.2 L36.8 44.1 L31.7 44.8 L27.0 44.9 L14.6 51.6 L12.4 52.4 L10.9 52.1 L9.6 50.8 L7.7 43.8 L7.7 43.0 L8.0 42.6 L10.1 41.6 L9.1 41.1 L9.1 38.5 L8.2 38.3 L7.9 37.9 L8.0 37.5 L8.9 36.6 L8.7 35.8 L5.7 34.2 L4.0 27.6 L0.6 26.6 Z"/>
  </symbol>
</svg>

<iframe id="lab" title="Website over the SR-71 scene" src="../sr71/"></iframe>

<!-- 1 -->
<button class="edge c-jet" data-concept="jet" data-enter aria-label="Fly: enter the 3D world">
  <span class="trail"></span><svg class="jet"><use href="#sr71"/></svg><span class="tip">FLY</span>
</button>

<!-- 2: also reused as the in-world readout for every concept -->
<button class="edge hud" data-concept="hud" data-enter aria-label="Enter the 3D world">
  <span class="row"><span class="orb"></span><span data-alt>85,000</span> FT</span>
  <span class="row">HDG <span data-hdg>274</span>°&nbsp;&nbsp;M3.2</span>
  <span class="go">ENTER ›</span>
</button>
<div class="edge hud world-hud" aria-hidden="true">
  <span class="row"><span class="orb"></span><span data-alt>85,000</span> FT</span>
  <span class="row">HDG <span data-hdg>274</span>°&nbsp;&nbsp;M3.2</span>
</div>

<!-- 3 -->
<button class="edge c-tape" data-concept="tape" data-enter aria-label="Enter the 3D world">
  <canvas id="tape"></canvas><span class="tip">PULL DOWN ↓</span>
</button>

<!-- 4 -->
<div class="edge c-frame" data-concept="frame">
  <button class="tl" data-enter aria-label="Enter the 3D world"><i></i></button>
  <button class="tr" data-enter aria-label="Enter the 3D world"><i></i></button>
  <button class="bl" data-enter aria-label="Enter the 3D world"><i></i></button>
  <button class="br" data-enter aria-label="Enter the 3D world"><i></i></button>
  <span class="tip">LOOK OUT</span>
</div>

<!-- 7 -->
<button class="edge c-alt" data-concept="alt" data-enter aria-label="Enter the 3D world">
  <canvas id="altimeter"></canvas><span class="tip">DESCEND ›</span>
</button>

<!-- in-world chrome -->
<div class="edge world w-title"><span data-idx>01 / 05</span><b data-world>Sierra Nevada</b></div>
<button class="edge world w-exit" id="exit">BACK TO SITE&nbsp;&nbsp;✕</button>
<div class="edge w-feed">
  <button id="prev" aria-label="Previous world">⌃</button>
  <div class="w-dots" id="dots"></div>
  <button id="next" aria-label="Next world">⌄</button>
</div>
<div class="edge world w-hint" id="hint">DRAG TO LOOK · SCROLL FOR NEXT WORLD</div>

<div id="veil"></div>
<div id="loading">LOADING SCENE</div>

<div id="switcher" class="open">
  <div class="sw-bar">
    <button id="sw-prev" aria-label="Previous concept">‹</button>
    <button class="sw-name" id="sw-name" aria-expanded="true"></button>
    <button id="sw-next" aria-label="Next concept">›</button>
  </div>
  <div class="sw-notes" id="sw-notes"></div>
</div>

<script>
const CONCEPTS = [
  { id: 'menu', name: 'Fly menu item', what: '"Fly" in the muted color with an SR-71 planform traced from the USAF three-view. Hover: it turns gold and the jet noses forward. Try the placements below.',
    click: 'The site fades out, the camera pushes in and swings, and the world takes over. Esc or Back returns you to the page you left.' },
  { id: 'hud', name: 'HUD readout', what: 'A two-line instrument readout in the bottom-left margin: altitude, live heading (it follows the camera), Mach, and the site\'s gold orb winking as a status light. Hover adds "ENTER ›".',
    click: 'Site fades out, the camera pushes in and swings, and the readout stays put as the world\'s own HUD. Feels continuous because the control is already part of the world.' },
  { id: 'jet', name: 'SR-71 in the corner', what: 'A 28px SR-71 planform in the bottom-right corner, angled across the page. Hover: it noses forward, a short gold contrail draws behind it, "FLY" appears.',
    click: 'The jet flies off toward the middle of the screen and vanishes into the scene as the site fades out. The most "easter egg" of the set, closest to the corner peel.' },
  { id: 'tape', name: 'Compass tape, top edge', what: 'A heading tape across the very top of the viewport, ticking with the camera\'s heading as the backdrop drifts. Gold caret at center. Hover: "PULL DOWN".',
    click: 'Click, or drag it down like pulling a blind, and the site drops away. The tape stays as the world\'s heading indicator.' },
  { id: 'frame', name: 'Canopy corners', what: 'Four viewfinder brackets in the corners, framing the page as a window you are looking through. Hover any corner: all four turn gold and lock inward.',
    click: 'Brackets snap out to the edges as the site fades, so the frame you saw becomes the canopy you look through.' },
  { id: 'footer', name: 'Footer altitude', what: 'The footer reads "© 2026 Had Seddiqi · 85,000 ft". The altitude is the link and lights gold on hover, with the jet sliding in.',
    click: 'Same transition. Pure easter egg: almost nobody scrolls to it, the people who do get rewarded.' },
  { id: 'alt', name: 'Altimeter edge', what: 'A thin altimeter tape on the right edge, where a scrollbar would sit. Scrolling the page winds the altitude down from 85,000 ft. Hover: "DESCEND ›".',
    click: 'Same transition. Ties in with the scroll-pan work: the page itself becomes a flight instrument.' },
];
const WORLDS = [['sierra', 'Sierra Nevada'], ['alps', 'Alps, Valais'], ['himalaya', 'Himalaya, Everest'], ['grandcanyon', 'Grand Canyon'], ['denali', 'Alaska Range, Denali']];
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];

// Start the lab from its defaults (Had's chosen look) every time, so toggles here never stick.
try { localStorage.removeItem('sr71-backdrop-v3'); } catch {}

const params = new URLSearchParams(location.search);
let ci = Math.max(0, CONCEPTS.findIndex((c) => c.id === (params.get('c') || 'menu')));
let plain = params.get('bg') === 'plain';
let notesOpen = params.has('notes') ? params.get('notes') !== '0' : innerWidth > 640;
let state = 'site';   // site | entering | world | leaving
let wi = 0;
const labFrame = $('#lab');
const L = () => labFrame.contentWindow && labFrame.contentWindow.__lab;
const labDoc = () => labFrame.contentDocument;
const siteFrame = () => labDoc() && labDoc().getElementById('site');
const siteDoc = () => { try { return siteFrame().contentDocument; } catch { return null; } };

// ---------- lab wiring ----------
function prepLab() {
  const doc = labDoc();
  if (!doc.getElementById('edge-mock')) {
    const st = doc.createElement('style'); st.id = 'edge-mock';
    st.textContent = '#panel{display:none!important} #site{transition:opacity .9s ease} #site,#backdrop{width:100%!important;height:100%!important}';
    doc.head.appendChild(st);
  }
  const f = siteFrame();
  if (f && !f.__edge) { f.__edge = true; f.addEventListener('load', decorateSite); }
  decorateSite();
  // In the world: the wheel flips worlds instead of zooming, keys work while the iframe has focus.
  const w = labFrame.contentWindow;
