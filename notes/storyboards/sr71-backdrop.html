<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>SR-71 backdrop lab</title>
<style>
  :root { --bg: #1c2433; --text: #c8cdd5; --muted: #8a919c; --glow: #e4c56f; --panel: rgba(16, 21, 30, 0.86); }
  html, body { margin: 0; height: 100%; background: #0b0d11; overflow: hidden; color: var(--text); font: 13px/1.4 Verdana, Geneva, system-ui, sans-serif; }
  canvas { display: block; position: fixed; inset: 0; width: 100vw; height: 100vh; touch-action: none; }
  #site { position: fixed; inset: 0; width: 100vw; height: 100vh; border: 0; background: transparent; color-scheme: normal; }
  #panel { position: fixed; top: 12px; right: 12px; width: 300px; max-height: calc(100vh - 24px); display: flex; flex-direction: column;
    background: var(--panel); border: 1px solid rgba(200, 205, 213, 0.14); border-radius: 10px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); z-index: 2; }
  #panel.closed { width: auto; }
  #panel.closed .panel-body, #panel.closed .panel-foot { display: none; }
  .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 10px; }
  .panel-head strong { font-weight: 600; letter-spacing: 0.02em; }
  button { font: inherit; color: var(--text); background: rgba(200, 205, 213, 0.08); border: 1px solid rgba(200, 205, 213, 0.2); border-radius: 6px; padding: 5px 9px; cursor: pointer; }
  button:hover { border-color: var(--glow); }
  .panel-body { overflow-y: auto; padding: 0 10px 6px; overscroll-behavior: contain; }
  fieldset { border: 0; border-top: 1px solid rgba(200, 205, 213, 0.12); margin: 0; padding: 8px 0 6px; }
  legend { color: var(--glow); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; padding: 0 6px 0 0; }
  .row { display: grid; grid-template-columns: 1fr 120px 38px; align-items: center; gap: 6px; margin: 5px 0; color: var(--text); }
  .row.color, .row.select, .row.check { grid-template-columns: 1fr 158px; }
  .row.check input { justify-self: start; }
  .row span { color: var(--muted); }
  output { text-align: right; font-variant-numeric: tabular-nums; color: var(--text); font-size: 11px; }
  input[type=range] { width: 100%; accent-color: var(--glow); }
  input[type=color] { width: 100%; height: 24px; border: 1px solid rgba(200, 205, 213, 0.2); border-radius: 4px; background: none; padding: 0; }
  input[type=checkbox] { accent-color: var(--glow); width: 16px; height: 16px; }
  select { font: inherit; color: var(--text); background: #141a25; border: 1px solid rgba(200, 205, 213, 0.2); border-radius: 4px; padding: 3px; width: 100%; }
  .panel-foot { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 10px 10px; border-top: 1px solid rgba(200, 205, 213, 0.12); }
  #status { flex-basis: 100%; min-height: 1.2em; color: var(--glow); font-size: 11px; }
  .hint { color: var(--muted); font-size: 11px; padding: 0 0 6px; }
  @media (max-width: 640px) {
    #panel { top: auto; bottom: 8px; left: 8px; right: 8px; width: auto; max-height: 55vh; }
    #panel.closed { left: auto; }
  }
</style>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
</head>
<body>
<canvas id="backdrop" aria-label="SR-71 at altitude, drag to look around"></canvas>
<iframe id="site" title="Website mockup" hidden></iframe>
<aside id="panel">
  <div class="panel-head"><strong>SR-71 backdrop</strong><button id="toggle" aria-expanded="true">Hide</button></div>
  <div class="panel-body">
    <p class="hint">Drag to look around, scroll or pinch to zoom, right-drag or two-finger drag to pan. Space toggles drift, H hides this panel. Settings stay in this browser.</p>
  </div>
  <div class="panel-foot">
    <button id="reset-view">Reset view</button>
    <button id="shot">Save PNG</button>
    <button id="copy">Copy link</button>
    <button id="reset-all">Defaults</button>
    <span id="status" role="status" aria-live="polite"></span>
    <small id="credit" class="hint" style="flex-basis:100%;padding:0"></small>
  </div>
</aside>
<script type="module" src="sr71-backdrop.mjs"></script>
</body>
</html>
