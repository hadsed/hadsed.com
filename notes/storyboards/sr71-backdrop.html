<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>SR-71 backdrop lab</title>
<style>
  :root { --bg: #1c2433; --text: #c8cdd5; --muted: #8a919c; --glow: #e4c56f; --panel: rgba(16, 21, 30, 0.86); }
  html, body { margin: 0; height: 100%; background: #0d1119; overflow: hidden; color: var(--text); font: 13px/1.4 Verdana, Geneva, system-ui, sans-serif; }
  canvas { display: block; position: fixed; inset: 0; width: 100vw; height: 100vh; touch-action: none; opacity: 0; transition: opacity 1.2s ease; }
  canvas.ready { opacity: 1; }
  #site { position: fixed; inset: 0; width: 100vw; height: 100vh; border: 0; background: transparent; color-scheme: normal; }
  #panel { position: fixed; top: 12px; right: 12px; width: 320px; max-height: calc(100vh - 24px); display: flex; flex-direction: column;
    background: var(--panel); border: 1px solid rgba(200, 205, 213, 0.14); border-radius: 10px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); z-index: 2; }
  #panel.closed { width: auto; }
  #panel.closed .panel-body, #panel.closed .panel-foot { display: none; }
  .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 10px; }
  .panel-head strong { font-weight: 600; letter-spacing: 0.02em; }
  button { font: inherit; color: var(--text); background: rgba(200, 205, 213, 0.08); border: 1px solid rgba(200, 205, 213, 0.2); border-radius: 6px; padding: 5px 9px; cursor: pointer; }
  button:hover { border-color: var(--glow); }
  .panel-body { overflow-y: auto; padding: 0 6px 6px; overscroll-behavior: contain; }
  /* Tweakpane, in the site's navy and gold */
  .panel-body .tp-rotv { --tp-base-background-color: transparent; --tp-base-shadow-color: transparent; --tp-base-font-family: Verdana, Geneva, system-ui, sans-serif;
    --tp-container-background-color: rgba(200, 205, 213, 0.08); --tp-container-background-color-hover: rgba(200, 205, 213, 0.12);
    --tp-container-foreground-color: #e4c56f; --tp-groove-foreground-color: rgba(200, 205, 213, 0.12);
    --tp-input-background-color: rgba(200, 205, 213, 0.08); --tp-input-background-color-hover: rgba(200, 205, 213, 0.13);
    --tp-input-foreground-color: #c8cdd5; --tp-label-foreground-color: #8a919c;
    --tp-button-background-color: rgba(200, 205, 213, 0.12); --tp-button-foreground-color: #c8cdd5; }
  input[type=checkbox] { accent-color: var(--glow); width: 16px; height: 16px; }
  select { font: inherit; color: var(--text); background: #141a25; border: 1px solid rgba(200, 205, 213, 0.2); border-radius: 4px; padding: 3px; width: 100%; }
  .panel-foot { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 10px 10px; border-top: 1px solid rgba(200, 205, 213, 0.12); }
  #status { flex-basis: 100%; min-height: 1.2em; color: var(--glow); font-size: 11px; }
  .hint { color: var(--muted); font-size: 11px; padding: 0 0 6px; }
  html.clean #panel { display: none; }
  @media (max-width: 640px) {
    #panel { top: auto; bottom: 8px; left: 8px; right: 8px; width: auto; max-height: 55vh; }
    #panel.closed { left: auto; }
  }
</style>
<script type="importmap">{"imports":{"three":"./vendor/three.module.min.js"}}</script>
<!-- fetch everything in parallel instead of module -> three -> json -> heightmap -->
<link rel="modulepreload" href="sr71-backdrop.mjs">
<link rel="modulepreload" href="vendor/three.module.min.js">
<link rel="modulepreload" href="vendor/three.core.min.js">
<link rel="modulepreload" href="vendor/OrbitControls.min.js">
<link rel="modulepreload" href="world/index.js">
<link rel="modulepreload" href="site-gestures.mjs">
<link rel="preload" href="terrain/regions.json" as="fetch" crossorigin>
<link rel="preload" href="terrain/sierra.webp" as="fetch" crossorigin>
</head>
<body>
<canvas id="backdrop" aria-label="SR-71 at altitude, drag to look around"></canvas>
<iframe id="site" title="Website mockup" hidden></iframe>
<aside id="panel">
  <div class="panel-head"><strong>SR-71 backdrop</strong><button id="toggle" aria-expanded="true">Hide</button></div>
  <div class="panel-body">
    <p class="hint">Drag to look around, scroll or pinch to zoom, right-drag or two-finger drag to pan. Space toggles drift, H hides this panel. Click a heading to open or close it. Settings stay in this browser.</p>
  </div>
  <div class="panel-foot">
    <button id="reset-view">Reset view</button>
    <button id="shot">Save PNG</button>
    <button id="copy">Copy link</button>
    <button id="reset-all">Defaults</button>
    <span id="status" role="status" aria-live="polite"></span>
    <small id="credit" class="hint" style="flex-basis:100%;padding:0"></small>
  </div>
</aside>
<script type="module" src="sr71-backdrop.mjs"></script>
</body>
</html>
