name: Build and deploy to Cloudflare Pages

# main deploys to hadsed.com. Every other branch deploys a Cloudflare preview at
# https://<branch-slug>.hadsed-com.pages.dev, so a PR can be checked before it is
# merged. The obsidian branch is skipped: the bridge on the Hetzner box rewrites it
# from the vault every 20 seconds, and copy deploys only when someone brings it
# into another branch on purpose.
on:
  push:
    branches: ['**', '!obsidian']

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: f659eb903a5d13a71c5b5dfa74a83cfb
          command: pages deploy _site --project-name=hadsed-com --branch=${{ github.ref_name }}
