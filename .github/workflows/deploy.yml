name: Build and deploy to Cloudflare Pages

# main deploys to hadsed.com. The obsidian branch (written by the bridge on the
# Hetzner box) deploys a preview at https://obsidian.hadsed-com.pages.dev so a
# content PR can be checked before it is merged.
on:
  push:
    branches: [main, obsidian, 'claude/**']

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Previews point og:image at their own pages.dev alias (Cloudflare's slug:
      # lowercase, non-alphanumerics to dashes, 28 chars) so a link preview can be
      # tested before the image is live on hadsed.com.
      - name: Set preview site URL
        if: github.ref_name != 'main'
        run: |
          slug=$(echo "${{ github.ref_name }}" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g' | cut -c1-28 | sed 's/-*$//')
          echo "SITE_URL=https://${slug}.hadsed-com.pages.dev" >> "$GITHUB_ENV"
      # Flight room server (flight/server). Previews share hadsed-flight; main deploys its own
      # hadsed-flight-prod (--env production). A failure here never blocks the site, it just flies solo.
      - name: Deploy flight room server
        id: flight
        if: github.ref_name != 'obsidian'
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: f659eb903a5d13a71c5b5dfa74a83cfb
          workingDirectory: flight/server
          command: deploy${{ github.ref_name == 'main' && ' --env production' || '' }}
      - name: Point the flight lab at the room server
        if: steps.flight.outcome == 'success' && steps.flight.outputs.deployment-url != ''
        run: |
          url="${{ steps.flight.outputs.deployment-url }}"
          echo "{ \"server\": \"${url/https:/wss:}\" }" > flight/config.json
          cat flight/config.json
      - run: npm run build
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: f659eb903a5d13a71c5b5dfa74a83cfb
          command: pages deploy _site --project-name=hadsed-com --branch=${{ github.ref_name }}
