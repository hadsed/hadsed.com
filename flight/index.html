<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Flight lab</title>
<!-- The import map must come before any module load or preload; Firefox ignores a late one. -->
<script type="importmap">{ "imports": { "three": "./vendor/three.module.js" } }</script>
<link rel="modulepreload" href="vendor/three.module.js">
<style>
  :root { --sky: #0f1520; --gold: #e4c56f; --dim: #8592a8; }
  html, body { margin: 0; height: 100%; background: var(--sky); color: var(--gold); overflow: hidden; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  body { font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 0.08em; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .hud { position: fixed; pointer-events: none; text-transform: uppercase; }
  #tl { top: max(14px, env(safe-area-inset-top)); left: 16px; }
  #tr { top: max(14px, env(safe-area-inset-top)); right: 16px; text-align: right; }
  #bl { bottom: max(14px, env(safe-area-inset-bottom)); left: 16px; }
  #help { bottom: max(14px, env(safe-area-inset-bottom)); right: 16px; text-align: right; color: var(--dim); transition: opacity 1s; }
  /* Phones: no keyboard, and the key list would run into the altimeter. */
  @media (max-width: 700px) { #help .keys { display: none; } }
  .dim { color: var(--dim); }
  #credit { text-transform: none; font-size: 9px; letter-spacing: 0; max-width: min(42vw, 260px); margin-top: 6px; opacity: 0.7; }
  /* Its own HUD item, set apart from "you are" above it. */
  #following { margin-top: 14px; }
  #unfollow { pointer-events: auto; font: inherit; color: var(--gold); background: none; border: 1px solid var(--gold); border-radius: 3px; margin-left: 10px; padding: 3px 8px; opacity: 0.75; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  #labels span.on { opacity: 1; }
  #labels span.hover { opacity: 1; border: 1px solid var(--gold); border-radius: 3px; padding: 2px 6px; background: rgba(10, 12, 18, 0.55); }
  #reticle { position: fixed; left: -11px; top: -11px; width: 20px; height: 20px; border: 1.5px solid var(--gold); border-radius: 50%; pointer-events: none; display: none; opacity: 0.85; }
  #reticle::after { content: ''; position: absolute; left: 50%; top: 50%; width: 3px; height: 3px; margin: -1.5px; background: var(--gold); border-radius: 50%; }
  #boost { position: fixed; right: 16px; bottom: calc(max(14px, env(safe-area-inset-bottom)) + 44px); font: inherit; letter-spacing: inherit; text-transform: uppercase; color: var(--gold); background: none; border: 1px solid var(--gold); border-radius: 3px; padding: 10px 14px; opacity: 0.6; touch-action: none; user-select: none; -webkit-user-select: none; }
  #boost.on { opacity: 1; background: rgba(228, 197, 111, 0.25); }
  #tilt { position: fixed; right: 16px; bottom: max(14px, env(safe-area-inset-bottom)); font: inherit; letter-spacing: inherit; text-transform: uppercase; color: var(--gold); background: none; border: 1px solid var(--gold); border-radius: 3px; padding: 6px 10px; opacity: 0.6; }
  #tilt.on { opacity: 1; background: rgba(228, 197, 111, 0.15); }
  #labels { pointer-events: none; }
  #labels span { pointer-events: none; position: fixed; transform: translate(-50%, -150%); color: var(--gold); opacity: 0.75; white-space: nowrap; font-size: 10px; }
  #stick { position: fixed; width: 10px; height: 10px; margin: -5px; border-radius: 50%; border: 1px solid var(--gold); pointer-events: none; display: none; }
  #thr { display: inline-block; width: 80px; height: 3px; background: #2a3448; vertical-align: middle; margin-left: 6px; }
  #thr i { display: block; height: 100%; background: var(--gold); }
  /* ?attract: the site backdrop. No HUD until Fly; it fades in as the camera settles behind the jet. */
  .hud, #labels, #boost, #tilt { transition: opacity .8s ease 2s; }
  body.attract .hud, body.attract #labels, body.attract #reticle, body.attract #boost, body.attract #tilt, body.attract #stick { opacity: 0 !important; pointer-events: none; transition: opacity .4s ease; }
  body.attract canvas { cursor: default; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="labels"></div>
<div id="stick"></div>
<!-- Top left is only who you are. #status stays for tests and the no-WebGL notice. -->
<div class="hud" id="tl"><div id="you" hidden><span class="dim">you are </span><span id="callsign"></span></div><div id="following" hidden><span id="followText"></span><button id="unfollow" title="Stop following (X)">stop following</button></div><div class="dim" id="status" hidden>loading</div></div>
<div class="hud" id="tr"><div id="aloft"></div></div>
<div class="hud" id="bl"><div id="alt"></div><div id="mach"></div><div>thr<span id="thr"><i></i></span></div></div>
<!-- Model credit lives in the page source, not on screen; main.js fills it from the jet asset. -->
<div id="credit" hidden></div>
<div id="reticle"></div>
<button id="boost" type="button" hidden>boost</button>
<button id="tilt" type="button" hidden>tilt</button>
<!-- Only shown when the browser cannot draw 3D. -->
<div class="hud" id="help" hidden>
  <span class="keys">WASD or arrows steer · R/F throttle · Space boost · E wave<br>or </span>drag to steer, let go to level out · tap a jet to follow<span class="keys"> · gamepad works too</span>
</div>
<script type="module" src="main.js"></script>
</body>
</html>
