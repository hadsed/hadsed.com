# Room server for /lab/flight. Deployed by .github/workflows/deploy.yml.
name = "hadsed-flight"
main = "worker.js"
compatibility_date = "2026-10-01"
workers_dev = true

[vars]
FLIGHT_ENABLED = "1"   # "0" is the kill switch: every client flies solo
MAX_INSTANCES = "20"   # copies per world; the budget cap
ROOM_CAPACITY = "200"  # jets per copy

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "FlightRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["FlightRoom"]

# Production room server for hadsed.com, deployed from main only (wrangler deploy --env production).
# Its own Worker and rooms, so pushes to preview branches never redeploy what production flies on.
[env.production]
name = "hadsed-flight-prod"

[env.production.vars]
FLIGHT_ENABLED = "1"
MAX_INSTANCES = "20"
ROOM_CAPACITY = "200"

[[env.production.durable_objects.bindings]]
name = "ROOMS"
class_name = "FlightRoom"
