# Room server for /lab/flight. Deployed by .github/workflows/deploy.yml.
name = "hadsed-flight"
main = "worker.js"
compatibility_date = "2026-10-01"
workers_dev = true

[vars]
FLIGHT_ENABLED = "1"   # "0" is the kill switch: every client flies solo
MAX_INSTANCES = "20"   # copies per world; the budget cap
ROOM_CAPACITY = "200"  # jets per copy

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "FlightRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["FlightRoom"]
