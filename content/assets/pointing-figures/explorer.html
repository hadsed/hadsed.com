<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pointing explorer</title>
<!-- Built from the lab explorer index (hadsed--point-correspond-v2-lab-lab.modal.run/explorer/data). Classes use r = 6.7 px in the answered image. -->
<style>:root{--bg:#1c2433;--panel:#222b3b;--panel2:#283245;--text:#c8cdd5;--muted:#8a919c;--accent:#e6e9ed;--line:#3a4558;--glow:#e4c56f;--hi:#6cb2e8;
  --precise:#2a9d8f;--near:#8bbf5a;--mid:#5b8fb9;--wrong_region:#d08a2e;--background:#d9534f;--wrong_part:#c0397a;--off_canvas:#a33;--undecodable:#7d8590}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:13px/1.45 Verdana,Geneva,system-ui,-apple-system,sans-serif}
body{padding:10px 12px 12px}
button{font:inherit;color:inherit}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.bar{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin:0 0 8px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.seg button{background:transparent;border:0;padding:3px 10px;cursor:pointer;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent);color:#1c2433}
select{font:inherit;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:4px;padding:2px 4px;max-width:100%}
.fs{margin-left:auto;background:transparent;border:1px solid var(--line);border-radius:4px;color:var(--muted);cursor:pointer;padding:1px 7px;font-size:13px}
.fs:hover{color:var(--accent)}
/* class chips */
.k{display:inline-block;padding:0 5px;border-radius:3px;color:#fff;font-size:11px;line-height:16px;white-space:nowrap}
/* results table */
.tbl{overflow:auto;border:1px solid var(--line);border-radius:4px;background:var(--panel)}
table.res{border-collapse:collapse;width:100%;font-size:12px}
table.res th,table.res td{border-bottom:1px solid var(--line);padding:5px 6px;text-align:left;vertical-align:top}
table.res thead th{position:sticky;top:0;background:var(--panel2);color:var(--muted);font-weight:normal;z-index:2;font-size:11px}
table.res thead th b{color:var(--text);font-weight:bold;display:block}
table.res th small{display:block;font-size:11px}
table.res td.sys{color:var(--text);min-width:120px;max-width:170px;font-size:11.5px}
table.res td.sys i{display:inline-block;vertical-align:0;width:8px;height:8px;border-radius:2px;margin-right:6px}
table.res td.c{cursor:pointer;min-width:88px}
table.res td.c:hover{background:var(--panel2)}
table.res td.c.sel{background:var(--panel2);box-shadow:inset 0 0 0 2px var(--glow)}
table.res td.c .v{font-size:13px;color:var(--accent)}
table.res td.na{color:var(--muted)}
table.res td.num{white-space:nowrap}
.spark{display:block;margin-top:3px}
tr.drawer td{padding:0;background:var(--bg);border-bottom:1px solid var(--line)}
.dwrap{height:262px;overflow-y:auto;padding:8px}
.dhead{display:flex;gap:10px;align-items:baseline;margin:0 0 6px;font-size:12px}
.dhead .x{margin-left:auto;cursor:pointer;background:transparent;border:0;color:var(--muted);font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:6px}
.tile{position:relative;cursor:pointer;border:1px solid var(--line);border-radius:3px;overflow:hidden;background:#111}
.tile svg{display:block;width:100%;aspect-ratio:1}
.tile .cap{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;gap:4px;padding:1px 4px;font-size:10px;background:rgba(15,20,28,.78);color:#e6e9ed}
.tile:hover{border-color:var(--glow)}
.legend{display:flex;flex-wrap:wrap;gap:4px 8px;margin:7px 0 0;font-size:11px;color:var(--muted);align-items:center}
/* modal */
.modal{position:fixed;inset:0;background:rgba(8,11,16,.86);display:none;z-index:10;padding:10px;overflow:auto}
.modal.on{display:block}
.mbox{max-width:980px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px}
.mtop{display:flex;gap:8px;align-items:center;margin:0 0 8px;flex-wrap:wrap}
.mtop .t{font-weight:bold;color:var(--accent)}
.mtop button{background:transparent;border:1px solid var(--line);border-radius:4px;cursor:pointer;padding:1px 8px;color:var(--text)}
.mtop .sp{margin-left:auto}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pane{position:relative}
.pane svg{display:block;width:100%;aspect-ratio:1;border-radius:3px}
.modal .pane svg{max-height:calc(100vh - 120px)}
.modal .pane .lab{left:50%;transform:translateX(-50%);border-radius:0 0 3px 3px}
.pane .lab{position:absolute;left:0;top:0;background:rgba(0,0,0,.6);color:#fff;font-size:11px;padding:0 5px;border-bottom-right-radius:3px}
dl.kv.row{display:flex;flex-wrap:wrap;gap:2px 14px}dl.kv.row div{display:flex;gap:5px}
dl.kv{display:grid;grid-template-columns:max-content 1fr;gap:1px 10px;margin:8px 0 0;font-size:12px}
dl.kv dt{color:var(--muted)} dl.kv dd{margin:0}
/* explorer */
.io{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.io h4{margin:0 0 3px;font-size:12px;font-weight:normal;color:var(--muted)}
.io .pane svg{cursor:zoom-in}
.step{display:inline-flex;align-items:center;gap:4px}
.step button{background:var(--panel);border:1px solid var(--line);border-radius:4px;cursor:pointer;padding:0 8px;line-height:20px}
@media (max-width:560px){.io{grid-template-columns:1fr 1fr}.io>div:first-child{grid-column:1/3}.pair{grid-template-columns:1fr}}

  const R6 = 6.7, RINGS = [R6, 2 * R6, 3 * R6], RING_COL = ["#22c55e", "#eab308", "#ef4444"], ANSWER = "#3b82f6";
  const PIXEL = new Set(["same_image", "exact_2d", "view_roll"]);
  const LABEL = {same_image: "Same image", exact_2d: "Exact 2D transform", view20: "Small view change", view60: "Large view change",
                 view_roll: "Camera roll", view_small: "Small view change", view_large: "Large view change"};
  const CLS_NAME = {precise: "precise", near: "near", mid: "mid", wrong_region: "wrong place", background: "off the part",
                    wrong_part: "wrong object", off_canvas: "off canvas", undecodable: "no answer"};
  const CLS_ORDER = ["precise", "near", "mid", "wrong_region", "background", "wrong_part", "off_canvas", "undecodable"];
  const DS_NAME = {v1: "single part", workbench: "workbench"};
  const css = (n) => getComputedStyle(document.documentElement).getPropertyValue("--" + n).trim();
  const chip = (c) => `<span class="k" style="background:${css(c)}">${esc(CLS_NAME[c] || c)}</span>`;
  const img = (p) => "img/" + p.replace(/\//g, "-").replace(/\.png$/, ".webp");
  const fmt = (x, d) => x == null || isNaN(x) ? "—" : Number(x).toFixed(d);
  const short = (stem) => stem.replace(/_s\d+$/, "").replace(/^workbench_/, "");
  const median = (a) => { if (!a.length) return null; const s = a.slice().sort((x, y) => x - y), m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };

  // ---------- data ----------
  const SL = {};
  for (const [k, d] of Object.entries(DATA)) {
    const rows = d.rows.map((a) => { const o = {}; d.cols.forEach((c, i) => { o[c] = a[i]; }); return o; });
    for (const r of rows) { r.sysA = d.systems[r.sys].alias; r.condK = d.conds[r.cond]; r.stemK = d.stems[r.stem]; r.key = k; }
    SL[k] = Object.assign({}, d, {R: rows});
  }
  const lossOf = (r, mode) => (PIXEL.has(r.condK) || mode === "px") ? r.lpx : r.lsurf;
  // the total loss of the draft: mean over families of the mean over that family's answers
  function famMean(rs, mode) {
    const by = new Map();
    for (const r of rs) { const v = lossOf(r, mode); if (v == null) continue; if (!by.has(r.family)) by.set(r.family, []); by.get(r.family).push(v); }
    if (!by.size) return null;
    let s = 0; for (const a of by.values()) s += a.reduce((x, y) => x + y, 0) / a.length;
    return s / by.size;
  }
  const cellRows = (sl, alias, cond) => sl.R.filter((r) => r.sysA === alias && r.condK === cond);

  // ---------- drawing ----------
  function marks(tgt, pred, k) {
    const rings = RINGS.map((rr, i) => `<circle cx="${tgt[0]}" cy="${tgt[1]}" r="${rr}" fill="none" stroke="${RING_COL[i]}" stroke-width="${1.3 * k}" stroke-dasharray="${3 * k},${3 * k}"/>`).join("");
    const arm = 7 * k;
    const x = pred ? `<path d="M${pred[0] - arm} ${pred[1] - arm}L${pred[0] + arm} ${pred[1] + arm}M${pred[0] - arm} ${pred[1] + arm}L${pred[0] + arm} ${pred[1] - arm}" stroke="rgba(6,12,8,.55)" stroke-width="${4.6 * k}" fill="none"/>
      <path d="M${pred[0] - arm} ${pred[1] - arm}L${pred[0] + arm} ${pred[1] + arm}M${pred[0] - arm} ${pred[1] + arm}L${pred[0] + arm} ${pred[1] - arm}" stroke="${ANSWER}" stroke-width="${2.6 * k}" fill="none"/>` : "";
    return rings + `<circle cx="${tgt[0]}" cy="${tgt[1]}" r="${1.6 * k}" fill="#22c55e"/>` + x;
  }
  // the render cropped to a window around the truth, widened to keep the answer in view
  function zoomSvg(path, tgt, pred, win) {
    const w = 512, h = 512;
    const cx = pred ? (tgt[0] + pred[0]) / 2 : tgt[0], cy = pred ? (tgt[1] + pred[1]) / 2 : tgt[1];
    const need = pred ? 2.2 * Math.hypot(pred[0] - tgt[0], pred[1] - tgt[1]) : 0;
    const s = Math.min(Math.max(win || 120, need), w);
    const x0 = Math.max(0, Math.min(w - s, cx - s / 2)), y0 = Math.max(0, Math.min(h - s, cy - s / 2));
    return `<svg viewBox="${x0.toFixed(1)} ${y0.toFixed(1)} ${s.toFixed(1)} ${s.toFixed(1)}"><image href="${esc(img(path))}" x="0" y="0" width="${w}" height="${h}"/>${marks(tgt, pred, s / 200)}</svg>`;
  }
  function fullSvg(path, tgt, pred) {
    return `<svg viewBox="0 0 512 512"><image href="${esc(img(path))}" x="0" y="0" width="512" height="512"/>${tgt ? marks(tgt, pred, 1.6) : ""}</svg>`;
  }
  function spark(values) {
    if (values.length < 3) return "";
    const w = 80, h = 13, bins = 14, hist = new Array(bins).fill(0);
    for (const v of values) hist[Math.min(bins - 1, Math.max(0, Math.floor(v * bins)))]++;
    const top = Math.max(...hist) || 1, bw = w / bins;
    return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true">` + hist.map((n, i) => {
      const bh = Math.max(n ? 1 : 0, Math.round(h * n / top)), t = i / (bins - 1);
      const col = t < 0.25 ? "#2a9d8f" : t < 0.5 ? "#5b8fb9" : t < 0.75 ? "#d08a2e" : "#d9534f";
      return `<rect x="${(i * bw).toFixed(1)}" y="${h - bh}" width="${(bw - 0.8).toFixed(1)}" height="${bh}" fill="${col}"/>`;
    }).join("") + `</svg>`;
  }
  function classCounts(rs) {
    const n = {}; for (const r of rs) n[r.cls] = (n[r.cls] || 0) + 1;
    return CLS_ORDER.filter((c) => n[c]).map((c) => `${chip(c)} <span class="mono">${n[c]}</span>`).join(" ");
  }

  // ---------- modal: one answer, source and target at full size ----------
  let mList = [], mIdx = 0;
  function openModal(list, i) { mList = list; mIdx = i; drawModal(); $("#modal").classList.add("on"); post(); }
  function closeModal() { $("#modal").classList.remove("on"); post(); }
  function drawModal() {
    const r = mList[mIdx], sl = SL[r.key], b = sl.bundles[r.stemK], cv = b.conds[r.condK], sys = sl.systems[r.sys];
    $("#modal").innerHTML = `<div class="mbox"><div class="mtop"><span class="t">${esc(sys.label)}</span>
      <span class="muted">${esc(LABEL[r.condK])} · ${esc(short(r.stemK))}</span>
      <span class="sp"></span><span class="muted mono">${mIdx + 1} / ${mList.length}</span>
      <button data-m="-1" aria-label="previous">‹</button><button data-m="1" aria-label="next">›</button><button data-m="x" aria-label="close">✕</button></div>
      <div class="pair"><div class="pane">${fullSvg(b.src, null, null)}<span class="lab">source, marked</span></div>
        <div class="pane">${fullSvg(cv.img, cv.tgt, r.pred)}<span class="lab">target: answer against truth</span></div></div>
      <dl class="kv row"><div><dt>answer</dt><dd class="mono">${r.pred ? r.pred.map((x) => Math.round(x)).join(", ") : "none"}</dd></div>
        <div><dt>truth</dt><dd class="mono">${cv.tgt.map((x) => Math.round(x)).join(", ")}</dd></div>
        <div><dt>off by</dt><dd class="mono">${r.err == null ? "—" : fmt(r.err, 1) + " px"}</dd></div>
        <div><dt>class</dt><dd>${chip(r.cls)}</dd></div>
        <div><dt>loss</dt><dd class="mono">pixel ${fmt(r.lpx, 4)}${r.lsurf != null ? ` · surface ${fmt(r.lsurf, 4)}` : ""}</dd></div>
        <div><dt>family</dt><dd>${esc(b.family)}</dd></div></dl>
      <p class="muted" style="font-size:11px;margin:4px 0 0">Rings at r, 2r and 3r, with r = 6.7 px. The cross is the answer. Arrow keys step, Esc closes.</p></div>`;
  }
  document.addEventListener("click", (e) => {
    if (e.target.id === "modal") return closeModal();
    const m = e.target.closest("[data-m]");
    if (!m) return;
    if (m.dataset.m === "x") return closeModal();
    mIdx = (mIdx + Number(m.dataset.m) + mList.length) % mList.length; drawModal();
  });
  document.addEventListener("keydown", (e) => {
    if (!$("#modal").classList.contains("on")) {
      if (W.kind === "explorer" && (e.key === "ArrowRight" || e.key === "ArrowLeft")) { ex.idx += e.key === "ArrowRight" ? 1 : -1; drawExplorer(); }
      return;
    }
    if (e.key === "Escape") closeModal();
    if (e.key === "ArrowRight" || e.key === "ArrowLeft") { mIdx = (mIdx + (e.key === "ArrowRight" ? 1 : -1) + mList.length) % mList.length; drawModal(); }
  });

  // ---------- results table ----------
  let mode = "surf", sel = null;      // sel: {alias, cond}
  function drawerHtml(sl, alias, cond, ncol) {
    const rs = cellRows(sl, alias, cond).slice().sort((a, b) => (lossOf(a, mode) ?? 2) - (lossOf(b, mode) ?? 2) || (a.err ?? 1e9) - (b.err ?? 1e9));
    const sys = sl.systems.find((s) => s.alias === alias);
    const tiles = rs.map((r, i) => {
      const cv = sl.bundles[r.stemK].conds[r.condK];
      return `<div class="tile" data-t="${i}">${zoomSvg(cv.img, cv.tgt, r.pred, 110)}<div class="cap"><span style="color:${css(r.cls)}">●</span><span class="mono">${r.err == null ? "—" : fmt(r.err, 1) + " px"}</span></div></div>`;
    }).join("");
    window.__drawer = rs;
    return `<tr class="drawer"><td colspan="${ncol}"><div class="dwrap"><div class="dhead"><b>${esc(sys.label)}</b><span class="muted">${esc(LABEL[cond])} · ${rs.length} answers, best first</span>
      <button class="x" data-close="1" aria-label="close">✕</button></div>
      <div class="legend" style="margin:0 0 7px">${classCounts(rs)}</div><div class="grid">${tiles}</div></div></td></tr>`;
  }
  function drawTable() {
    const sl = SL[W.slice], conds = sl.conds, harness = W.kind === "harness";
    const nOf = (c) => new Set(sl.R.filter((r) => r.condK === c).map((r) => r.stemK)).size;
    const systems = sl.systems.slice();
    if (harness) systems.sort((a, b) => famMean(cellRows(sl, a.alias, conds[0]), mode) - famMean(cellRows(sl, b.alias, conds[0]), mode));
    const ncol = 1 + conds.length + (harness ? 3 : 0);
    let h = `<table class="res"><thead><tr><th>system</th>` + conds.map((c) => {
      const kind = PIXEL.has(c) || mode === "px" ? "pixel loss" : "surface loss";
      return `<th><b>${esc(LABEL[c])}</b><small>${kind}, mean</small><small class="mono">N = ${nOf(c)}</small></th>`;
    }).join("") + (harness ? `<th><b>precise</b><small>within r</small></th><th><b>$ / question</b><small>mean</small></th><th><b>time</b><small>median</small></th>` : "") + `</tr></thead><tbody>`;
    for (const s of systems) {
      h += `<tr><td class="sys"><i style="background:${esc(s.colour)}"></i>${esc(s.label)}</td>`;
      for (const c of conds) {
        const rs = cellRows(sl, s.alias, c);
        if (!rs.length) { h += `<td class="na">—</td>`; continue; }
        const on = sel && sel.alias === s.alias && sel.cond === c;
        h += `<td class="c${on ? " sel" : ""}" data-a="${esc(s.alias)}" data-c="${c}"><span class="v mono">${fmt(famMean(rs, mode), 4)}</span>${spark(rs.map((r) => lossOf(r, mode)).filter((x) => x != null))}</td>`;
      }
      if (harness) {
        const rs = cellRows(sl, s.alias, conds[0]);
        const cost = rs.map((r) => r.cost).filter((x) => x != null), wall = rs.map((r) => r.wall).filter((x) => x != null);
        h += `<td class="num mono">${rs.filter((r) => r.cls === "precise").length} / ${rs.length}</td>
              <td class="num mono">${cost.length ? "$" + fmt(cost.reduce((a, b) => a + b, 0) / cost.length, 2) : "—"}</td>
              <td class="num mono">${wall.length ? Math.round(median(wall)) + " s" : "—"}</td>`;
      }
      h += `</tr>`;
      if (sel && sel.alias === s.alias) h += drawerHtml(sl, sel.alias, sel.cond, ncol);
    }
    h += `</tbody></table>`;
    const showToggle = conds.some((c) => !PIXEL.has(c));
    $("#app").innerHTML = `<div class="bar">${showToggle ? `<span class="muted">loss</span><span class="seg"><button data-mode="px" class="${mode === "px" ? "on" : ""}">pixel</button><button data-mode="surf" class="${mode === "surf" ? "on" : ""}">surface</button></span>` : ""}
      <span class="muted">${esc(sl.half)} half, ${esc(DS_NAME[sl.dataset])}${harness ? ", five bench questions from the mini dev set" : ""}. Click a cell for its answers.</span>
      <button class="fs" title="full screen" aria-label="full screen">⤢</button></div><div class="tbl">${h}</div>
      <div class="legend">Each cell: mean loss over part families (lower is better), with the spread of single-answer losses from 0 to 1 beneath.</div>`;
    post();
  }
  if (W.kind === "table" || W.kind === "harness") {
    document.addEventListener("click", (e) => {
      const md = e.target.closest("[data-mode]");
      if (md) { mode = md.dataset.mode; drawTable(); return; }
      if (e.target.closest("[data-close]")) { sel = null; drawTable(); return; }
      const t = e.target.closest(".tile");
      if (t) { openModal(window.__drawer, Number(t.dataset.t)); return; }
      const c = e.target.closest("td.c");
      if (c) {
        sel = sel && sel.alias === c.dataset.a && sel.cond === c.dataset.c ? null : {alias: c.dataset.a, cond: c.dataset.c};
        drawTable();
        const d = $("tr.drawer"); if (d) d.scrollIntoView({block: "nearest"});
      }
    });
  }

  // ---------- explorer ----------
  const ex = {mode: "zs", ds: "v1", sys: null, cond: null, idx: 0};
  function exSlice() { return SL[(ex.mode === "zs" ? "zs_" : "h_") + (ex.ds === "v1" ? "v1" : "wb")]; }
  function drawExplorer() {
    const sl = exSlice();
    if (!sl.systems.some((s) => s.alias === ex.sys)) ex.sys = (sl.systems.find((s) => s.alias === (ex.mode === "zs" ? "claude-fable-5" : "codex-astra-low")) || sl.systems[0]).alias;
    if (!sl.conds.includes(ex.cond)) ex.cond = sl.conds[Math.min(2, sl.conds.length - 1)];
    const list = cellRows(sl, ex.sys, ex.cond).slice().sort((a, b) => a.stem - b.stem || a.rep - b.rep);
    const n = list.length;
    ex.idx = n ? ((ex.idx % n) + n) % n : 0;
    const r = list[ex.idx];
    const bar = `<div class="bar"><span class="seg"><button data-xm="zs" class="${ex.mode === "zs" ? "on" : ""}">single-shot</button><button data-xm="h" class="${ex.mode === "h" ? "on" : ""}">harness</button></span>
      <span class="seg"><button data-xd="v1" class="${ex.ds === "v1" ? "on" : ""}">single part</button><button data-xd="wb" class="${ex.ds === "wb" ? "on" : ""}">workbench</button></span>
      <select id="xsys" aria-label="system">${sl.systems.map((s) => `<option value="${esc(s.alias)}"${s.alias === ex.sys ? " selected" : ""}>${esc(s.label)}</option>`).join("")}</select>
      <select id="xcond" aria-label="condition"${sl.conds.length < 2 ? " disabled" : ""}>${sl.conds.map((c) => `<option value="${c}"${c === ex.cond ? " selected" : ""}>${esc(LABEL[c])}</option>`).join("")}</select>
      <span class="step"><button data-xs="-1" aria-label="previous answer">‹</button><span class="mono muted">${n ? ex.idx + 1 : 0} / ${n}</span><button data-xs="1" aria-label="next answer">›</button></span>
      <button class="fs" title="full screen" aria-label="full screen">⤢</button></div>`;
    if (!r) { $("#app").innerHTML = bar + `<p class="muted">No answers stored for this system here.</p>`; post(); return; }
    const b = sl.bundles[r.stemK], cv = b.conds[r.condK];
    window.__exlist = list;
    $("#app").innerHTML = bar + `<div class="io">
      <div><h4>given: the source, marked</h4><div class="pane" data-open="1">${fullSvg(b.src, null, null)}</div>
        <dl class="kv"><dt>sample</dt><dd class="mono">${esc(short(r.stemK))}</dd><dt>${ex.mode === "zs" ? "answer" : "run"}</dt><dd class="mono">${ex.mode === "zs" ? (r.rep + 1) + " of this question" : "one per question"}</dd></dl></div>
      <div><h4>given: the target</h4><div class="pane" data-open="1">${fullSvg(cv.img, null, null)}</div>
        <dl class="kv"><dt>condition</dt><dd>${esc(LABEL[r.condK])}</dd><dt>half</dt><dd>${esc(sl.half)}</dd></dl></div>
      <div><h4>returned: answer against truth</h4><div class="pane" data-open="1">${zoomSvg(cv.img, cv.tgt, r.pred, 150)}</div>
        <dl class="kv"><dt>off by</dt><dd class="mono">${r.err == null ? "no answer" : fmt(r.err, 1) + " px"}</dd><dt>class</dt><dd>${chip(r.cls)}</dd></dl></div></div>`;
    post();
  }
  if (W.kind === "explorer") {
    document.addEventListener("click", (e) => {
      const m = e.target.closest("[data-xm]"); if (m) { ex.mode = m.dataset.xm; ex.idx = 0; return drawExplorer(); }
      const d = e.target.closest("[data-xd]"); if (d) { ex.ds = d.dataset.xd; ex.idx = 0; ex.cond = null; return drawExplorer(); }
      const s = e.target.closest("[data-xs]"); if (s) { ex.idx += Number(s.dataset.xs); return drawExplorer(); }
      if (e.target.closest("[data-open]")) openModal(window.__exlist, ex.idx);
    });
    document.addEventListener("change", (e) => {
      if (e.target.id === "xsys") { ex.sys = e.target.value; ex.idx = 0; drawExplorer(); }
      if (e.target.id === "xcond") { ex.cond = e.target.value; ex.idx = 0; drawExplorer(); }
    });
  }

  // ---------- frame plumbing ----------
  document.addEventListener("click", (e) => {
    if (!e.target.closest(".fs")) return;
    if (document.fullscreenElement) document.exitFullscreen(); else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {});
  });
  // tells a parent page that wants to size the frame to its content how tall it is
  function post() { try { parent.postMessage({type: "embed-height", height: document.documentElement.scrollHeight}, "*"); } catch (e) { /* not framed */ } }
  window.addEventListener("resize", post);
  if (W.kind === "explorer") drawExplorer(); else drawTable();
})();
</script>
</body></html>
